<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Almagest — Ask Almagest</title>
<meta name="description" content="Almagest: plan observing sessions, log what you see, and get recommendations that learn from you.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Ccircle cx='13' cy='13' r='11' fill='none' stroke='%23C9A44C' stroke-width='2'/%3E%3Ccircle cx='13' cy='13' r='2.5' fill='%23C9A44C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="nav"></header>
<main>
<div class="page-head">
  <div class="eyebrow">Assistant</div>
  <h1>Ask Almagest</h1>
  <p>A grounded assistant: it classifies your question with a TF-IDF intent model, then answers by calling the real ephemeris, recommender, event calculator and your logbook. It never makes up a number, and each answer shows which tools produced it.</p>
</div>
<div class="card" style="max-width:760px">
  <div id="chat" class="chat" aria-live="polite"></div>
  <div id="chips" class="chips"></div>
  <form id="ask-form" class="ask">
    <input id="q" type="text" maxlength="300" placeholder="e.g. Is Jupiter visible now?" autocomplete="off" required aria-label="Your question">
    <button class="btn" type="submit">Ask</button>
  </form>
</div>
</main>
<script src="app.js"></script>
<script src="assistant.js"></script>
</body>
</html>
